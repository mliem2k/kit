name: CI (Bun)

# The part of a Bun repo's CI that every repo repeats: checkout, Bun at a pinned version, the dependency cache and a frozen install.
# The caller passes the commands that are its own (typecheck, lint, tests, build) as `run`, and any environment as a JSON object.

on:
  workflow_call:
    inputs:
      run:
        description: Shell commands to run after the install, one per line; the job stops at the first one that fails
        required: true
        type: string
      bun_version:
        description: Bun version to install
        required: false
        type: string
        default: "1.4.4"
      working_directory:
        description: Directory the install and the commands run in
        required: false
        type: string
        default: "."
      runs_on:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["self-hosted","linux-mliem"]'
      env:
        description: JSON object of environment variables for the commands
        required: false
        type: string
        default: "{}"
      timeout_minutes:
        required: false
        type: number
        default: 30

jobs:
  ci:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env: ${{ fromJSON(inputs.env) }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ inputs.bun_version }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ inputs.bun_version }}-
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run
        run: ${{ inputs.run }}
